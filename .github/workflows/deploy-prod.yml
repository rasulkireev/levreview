# This is a basic workflow to help you get started with Actions

name: Prod Deploy

on:
  push:
    branches:
      main

env:
  PROJECT_DIR: /home/rasulkireev/levreview
  DO_PASSWORD: ${{ secrets.DO_PASSWORD }}
  SUDO_PREFIX: "echo ${{ secrets.DO_PASSWORD }} | sudo -S"

jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Pull the Latest Commit
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSHKEY }}
          script_stop: true
          envs: PROJECT_DIR
          script: |
            cd $PROJECT_DIR
            git fetch --all
            git reset --hard origin/main

      - name: Install Conf Files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSHKEY }}
          script_stop: true
          envs: PROJECT_DIR,DO_PASSWORD,SUDO_PREFIX
          script: |
            $SUDO_PREFIX cp $PROJECT_DIR/deployment/levreview.gunicorn.socket /etc/systemd/system/
            $SUDO_PREFIX cp $PROJECT_DIR/deployment/levreview.gunicorn.service /etc/systemd/system/

            $SUDO_PREFIX systemctl start levreview.gunicorn.socket
            $SUDO_PREFIX systemctl enable levreview.gunicorn.socket
            $SUDO_PREFIX systemctl status levreview.gunicorn.socket

            file /run/levreview.gunicorn.sock
            $SUDO_PREFIX journalctl -u levreview.gunicorn.socket
            $SUDO_PREFIX systemctl status levreview.gunicorn

            $SUDO_PREFIX cp $PROJECT_DIR/deployment/levreview.nginx.conf /etc/nginx/sites-available/
            $SUDO_PREFIX ln -s /etc/nginx/sites-available/levreview.nginx.conf /etc/nginx/sites-enabled
            $SUDO_PREFIX nginx -t
            $SUDO_PREFIX systemctl restart nginx
