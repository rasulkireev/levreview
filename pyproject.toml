[tool.poetry]
name = "levreview"
version = "0.1.0"
description = "Get better reviews on Google"
authors = ["Rasul Kireev <me@rasulkireev.com>"]

[tool.poetry.dependencies]
python = "^3.10"
Django = "^4.0.4"
django-allauth = "^0.50.0"
python-webpack-boilerplate = "^1.0.0"
django-widget-tweaks = "^1.4.12"
django-model-utils = "^4.2.0"
django-extensions = "^3.2.1"
qrcode = "^7.3.1"
Pillow = "^9.2.0"
dj-stripe = "^2.7"
django-environ = "^0.9.0"
gunicorn = "^20.1.0"
django-anymail = {extras = ["mailgun"], version = "^8.6"}
sentry-sdk = "^1.10.1"

[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
black = "^22.10.0"
pylint = "^2.15.5"
djlint = "^1.19.3"
isort = "^5.10.1"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.djlint]
profile = "django"
ignore = "H006,H023,H031,H021,H005,H030,H020,H016,D018"

[tool.isort]
profile = "django"
combine_as_imports = true
include_trailing_comma = true
line_length = 120
multi_line_output = 3

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
