{% load webpack_loader static %}

<div data-controller="dropdown" class="relative bg-white shadow">
  <div class="px-4 mx-auto max-w-7xl sm:px-6">
    <div class="flex items-center justify-between py-6 md:justify-start md:space-x-10">
      <div class="flex justify-start lg:w-0 lg:flex-1">
        <a href="#">
          <span class="sr-only">Fox Reviews</span>
          <img class="w-auto h-8 rounded-full sm:h-10" src="{% static 'vendors/images/logo.png' %}" alt="Fox Reviews">
        </a>
      </div>
      <div class="-my-2 -mr-2 md:hidden">
        <button
          data-action="dropdown#toggle click@window->dropdown#hide"
          type="button"
          class="inline-flex items-center justify-center p-2 text-gray-400 bg-white rounded-md hover:bg-gray-100 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-orange-500"
          aria-expanded="false"
        >
          <span class="sr-only">Open menu</span>
          <!-- Heroicon name: outline/bars-3 -->
          <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>
      <div class="items-center justify-end hidden md:flex md:flex-1 lg:w-0">
        {% if user.is_authenticated %}
          <a href="{% url 'account_signup' %}" class="inline-flex items-center justify-center px-4 py-2 ml-8 text-base font-medium text-white bg-orange-600 border border-transparent rounded-md shadow-sm whitespace-nowrap hover:bg-orange-700">Dashboard</a>
        {% else %}
          <a href="{% url 'account_login' %}" class="text-base font-medium text-gray-500 whitespace-nowrap hover:text-gray-900">Sign in</a>
          <a href="{% url 'account_signup' %}" class="inline-flex items-center justify-center px-4 py-2 ml-8 text-base font-medium text-white bg-orange-600 border border-transparent rounded-md shadow-sm whitespace-nowrap hover:bg-orange-700">Sign up</a>
        {% endif %}
      </div>
    </div>
  </div>

  <div
    data-dropdown-target="menu"
    data-transition-enter-active="ease-out duration-200"
    data-transition-enter-from="opacity-0 scale-95"
    data-transition-enter-to="opacity-100 scale-100"
    data-transition-leave-active="ease-in duration-100"
    data-transition-leave-from="opacity-100 scale-100"
    data-transition-leave-to="opacity-0 scale-95"
    class="absolute inset-x-0 top-0 z-10 p-2 transition origin-top-right transform md:hidden"
  >
    <div class="bg-white divide-y-2 rounded-lg shadow-lg divide-gray-50 ring-1 ring-black ring-opacity-5">
      <div class="px-5 pt-5 pb-6">
        <div class="flex items-center justify-between">
          <diFox>
            <img class="rounded-full Fox Reviews" src="{% static 'vendors/images/logo.png' %}" alt="Your Company">
          </diFox Reviewsv>
          <div class="-mr-2">
            <button
              data-action="dropdown#toggle" type="button" class="inline-flex items-center justify-center p-2 text-gray-400 bg-white rounded-md hover:bg-gray-100 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-orange-500">
              <span class="sr-only">Close menu</span>
              <!-- Heroicon name: outline/x-mark -->
              <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="px-5 py-6 space-y-6">
        <div>
          <a href="{% url 'account_signup' %}" class="flex items-center justify-center w-full px-4 py-2 text-base font-medium text-white bg-orange-600 border border-transparent rounded-md shadow-sm hover:bg-orange-700">Sign up</a>
          <p class="mt-6 text-base font-medium text-center text-gray-500">
            Existing customer?
            <a href="{% url 'account_login' %}" class="text-orange-600 hover:text-orange-500">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
