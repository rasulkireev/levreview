{% load webpack_loader static %}

<header data-controller="mobile-menu" data-action="click@window->mobile-menu#hideOnOutside keydown.esc@window->mobile-menu#close" class="relative z-30">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8" aria-label="Main navigation">
    <a href="{% url 'home' %}" class="group flex items-center gap-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-[#07100d]">
      <img class="h-10 w-10 rounded-lg object-cover ring-1 ring-white/15" src="{% static 'vendors/favicon/logo.jpg' %}" alt="Lev Review" />
      <span class="font-display text-lg font-semibold tracking-tight text-white">Lev Review</span>
    </a>

    <div class="hidden items-center gap-8 md:flex">
      <a href="#workflow" class="text-sm font-medium text-white/70 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-emerald-300">Workflow</a>
      <a href="#pricing" class="text-sm font-medium text-white/70 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-emerald-300">Pricing</a>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center rounded-lg bg-white px-4 py-2 text-sm font-semibold text-[#07100d] transition hover:bg-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-[#07100d]">Open dashboard</a>
      {% else %}
        <a href="{% url 'account_login' %}" class="text-sm font-medium text-white/70 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-emerald-300">Sign in</a>
        <a href="{% url 'account_signup' %}" class="inline-flex items-center justify-center rounded-lg bg-white px-4 py-2 text-sm font-semibold text-[#07100d] transition hover:bg-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-[#07100d]">Start collecting</a>
      {% endif %}
    </div>

    <button
      data-mobile-menu-target="button"
      data-action="mobile-menu#toggle"
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-lg border border-white/15 text-white transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-[#07100d] md:hidden"
      aria-controls="home-mobile-menu"
      aria-expanded="false"
    >
      <span class="sr-only">Open menu</span>
      <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </nav>

  <div
    id="home-mobile-menu"
    data-mobile-menu-target="menu"
    class="hidden absolute inset-x-4 top-4 z-40 origin-top rounded-lg border border-white/10 bg-[#0b1714] p-4 text-white md:hidden"
  >
    <div class="flex items-center justify-between">
      <span class="font-display text-base font-semibold">Lev Review</span>
      <button
        data-action="mobile-menu#close"
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-white/70 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-emerald-300"
      >
        <span class="sr-only">Close menu</span>
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mt-6 grid gap-3">
      <a href="#workflow" data-action="mobile-menu#close" class="rounded-lg px-3 py-2 text-base font-medium text-white/80 transition hover:bg-white/10 hover:text-white">Workflow</a>
      <a href="#pricing" data-action="mobile-menu#close" class="rounded-lg px-3 py-2 text-base font-medium text-white/80 transition hover:bg-white/10 hover:text-white">Pricing</a>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" data-action="mobile-menu#close" class="mt-2 inline-flex items-center justify-center rounded-lg bg-white px-4 py-3 text-base font-semibold text-[#07100d]">Open dashboard</a>
      {% else %}
        <a href="{% url 'account_login' %}" data-action="mobile-menu#close" class="rounded-lg px-3 py-2 text-base font-medium text-white/80 transition hover:bg-white/10 hover:text-white">Sign in</a>
        <a href="{% url 'account_signup' %}" data-action="mobile-menu#close" class="mt-2 inline-flex items-center justify-center rounded-lg bg-white px-4 py-3 text-base font-semibold text-[#07100d]">Start collecting</a>
      {% endif %}
    </div>
  </div>
</header>
